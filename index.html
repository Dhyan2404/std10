<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Studies Master Quiz</title>
    <style>
        :root {
            --primary: #4e54c8;
            --secondary: #8f94fb;
            --correct: #2ecc71;
            --wrong: #e74c3c;
            --text: #2c3e50;
            --bg: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #4e54c8, #8f94fb);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            overflow-x: hidden;
        }

        /* --- SOUND ASSETS (Hidden) --- */
        audio { display: none; }

        /* --- UI CARD --- */
        .quiz-card {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
            font-weight: bold;
        }

        .streak-box {
            background: #ff9f43;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .progress-bar {
            height: 6px;
            background: #eee;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.3em;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 600;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
            position: relative;
        }

        .option-btn:hover:not(.disabled) {
            background: #e9ecef;
            transform: translateY(-2px);
            border-color: var(--secondary);
        }

        /* --- ANIMATION CLASSES --- */
        .correct-anim {
            background-color: #d4edda !important;
            border-color: #2ecc71 !important;
            color: #155724;
            animation: pop 0.3s ease;
        }

        .wrong-anim {
            background-color: #f8d7da !important;
            border-color: #e74c3c !important;
            color: #721c24;
            animation: shake 0.4s ease;
        }

        .shake-card {
            animation: shake 0.4s ease;
        }

        .slide-out {
            animation: slideOut 0.4s forwards;
        }

        .slide-in {
            animation: slideIn 0.4s forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideOut {
            to { transform: translateX(-120%); opacity: 0; }
        }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* --- RESULTS SCREEN --- */
        #result-screen {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            margin: 0 auto 20px auto;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(78, 84, 200, 0.4);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover { background: var(--secondary); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); margin-left: 10px; }
        
        .disabled { pointer-events: none; opacity: 0.8; }

    </style>
</head>
<body>

<div class="quiz-card" id="quiz-card">
    
    <div id="start-screen" style="text-align: center;">
        <h1 style="color: var(--primary);">Computer Studies</h1>
        <h3 style="color: #666;">Papers 1 to 5</h3>
        <p>250 Questions Loaded</p>
        <p style="color: #888; font-size: 0.9em;">Turn up your volume! 🔊</p>
        <button class="btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="header">
            <span>Question <span id="q-current">1</span>/<span id="q-total">250</span></span>
            <div class="streak-box">🔥 <span id="streak-count">0</span></div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div id="question-container">
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-grid" id="options-grid">
                </div>
        </div>
    </div>

    <div id="result-screen">
        <h2 style="color: var(--text);">Quiz Completed!</h2>
        <div class="score-circle">
            <span id="final-score">0</span>%
        </div>
        <p id="result-msg" style="font-size: 1.2em; font-weight: bold;">Great effort!</p>
        <div id="stats-detail" style="margin: 15px 0; color: #666;"></div>
        
        <button class="btn" onclick="retryIncorrect()" id="btn-retry">Retry Incorrect</button>
        <button class="btn btn-outline" onclick="location.reload()">Restart All</button>
    </div>

</div>

<script>
    // --- SOUND ENGINE ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    { id: 103, q: "3. <title> ટૅગમાં લખાયેલ લખાણ નીચે પૈકી ક્યાં જોવા મળે છે?", options: ["બ્રાઉઝર વિન્ડોના ટાઈટલ બારમાં", "બ્રાઉઝરની હિસ્ટ્રીમાં", "Bookmark list", "આપેલ તમામમાં"], answer: 3 },
    { id: 104, q: "4. નીચે પૈકી કોને ખાસ ચિહનો કહેવાય છે?", options: [">, <", "&", "$1/2$ $3/4$", "આપેલ તમામ"], answer: 3 },

    { id: 106, q: "6. જો head વિભાગમાં શીર્ષક લખવામાં ન આવ્યું હોય, તો બ્રાઉઝર શું દર્શાવે?", options: ["URL path", "ફાઈલનું નામ", "A અથવા B", "બ્રાઉઝરનું નામ"], answer: 2 },

    // --- LOGIC ---
    let currentQIndex = 0;
    let score = 0;
    let streak = 0;
    let wrongQuestions = [];
    let isReviewing = false;
    let activeQuestions = [];

    // DOM Elements
    const card = document.getElementById('quiz-card');
    const qText = document.getElementById('question-text');
    const optionsGrid = document.getElementById('options-grid');
    const progressBar = document.getElementById('progress-fill');
    const currentSpan = document.getElementById('q-current');
    const totalSpan = document.getElementById('q-total');
    const streakSpan = document.getElementById('streak-count');

    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        
        activeQuestions = [...allQuestions];
        totalSpan.innerText = activeQuestions.length;
        loadQuestion();
    }

    function loadQuestion() {
        const container = document.getElementById('question-container');
        container.classList.remove('slide-out');
        container.classList.add('slide-in');

        // Reset Animation Class
        setTimeout(() => container.classList.remove('slide-in'), 400);

        const q = activeQuestions[currentQIndex];
        qText.innerText = q.q;
        optionsGrid.innerHTML = '';
        currentSpan.innerText = currentQIndex + 1;

        // Update Progress
        const pct = ((currentQIndex) / activeQuestions.length) * 100;
        progressBar.style.width = pct + '%';

        q.options.forEach((opt, index) => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, q.answer, btn, q);
            optionsGrid.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct, btn, qObj) {
        // Disable clicks
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.classList.add('disabled'));

        if (selected === correct) {
            // Correct
            btn.classList.add('correct-anim');
            playSound('correct');
            streak++;
            score++;
        } else {
            // Wrong
            btn.classList.add('wrong-anim');
            card.classList.add('shake-card');
            playSound('incorrect');
            streak = 0;
            
            // Show correct answer
            allBtns[correct].classList.add('correct-anim');
            
            // Add to retry list
            if (!isReviewing) {
                if (!wrongQuestions.some(wq => wq.id === qObj.id)) {
                    wrongQuestions.push(qObj);
                }
            }
            
            setTimeout(() => card.classList.remove('shake-card'), 400);
        }

        streakSpan.innerText = streak;

        // Auto Advance
        setTimeout(() => {
            const container = document.getElementById('question-container');
            container.classList.add('slide-out');
            
            setTimeout(() => {
                currentQIndex++;
                if (currentQIndex < activeQuestions.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 300);
        }, 1200); // 1.2s delay to read answer
    }

    function showResults() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        const percentage = Math.round((score / activeQuestions.length) * 100);
        document.getElementById('final-score').innerText = percentage;
        
        const statsDiv = document.getElementById('stats-detail');
        statsDiv.innerText = `You got ${score} correct out of ${activeQuestions.length}.`;

        const retryBtn = document.getElementById('btn-retry');
        if (wrongQuestions.length > 0 && !isReviewing) {
            retryBtn.style.display = 'inline-block';
            retryBtn.innerText = `Retry ${wrongQuestions.length} Incorrect Questions`;
        } else {
            retryBtn.style.display = 'none';
        }

        const msgLabel = document.getElementById('result-msg');
        if (percentage >= 80) { msgLabel.innerText = "Outstanding! 🏆"; msgLabel.style.color = "var(--correct)"; }
        else if (percentage >= 50) { msgLabel.innerText = "Good job! Keep practicing. 📚"; msgLabel.style.color = "orange"; }
        else { msgLabel.innerText = "Don't give up! Review and try again. 💪"; msgLabel.style.color = "var(--wrong)"; }
    }

    function retryIncorrect() {
        if (wrongQuestions.length === 0) return;
        
        isReviewing = true;
        activeQuestions = [...wrongQuestions];
        currentQIndex = 0;
        score = 0;
        streak = 0;
        
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        totalSpan.innerText = activeQuestions.length;
        
        loadQuestion();
    }

</script>
